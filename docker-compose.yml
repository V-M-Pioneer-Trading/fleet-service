services:
  app:
    container_name: fleet-service-app
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # Every SpaceTraders call goes through st-gateway's shared rate budget.
      # The service has no SpaceTraders base URL of its own by design.
      ST_GATEWAY_URL: http://host.docker.internal:3002
      AGENT_SERVICE_URL: http://host.docker.internal:8080/api/agent/v1
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      # Required: the service refuses to start without both. auth-service is
      # the only token verifier (decision 21); run it locally and pass the
      # introspection secret it was started with.
      AUTH_INTROSPECTION_URL: ${AUTH_INTROSPECTION_URL:-http://host.docker.internal:3005/auth/v1/introspect}
      AUTH_INTROSPECTION_SECRET: ${AUTH_INTROSPECTION_SECRET:?set AUTH_INTROSPECTION_SECRET}
    # host.docker.internal is not resolvable on Linux without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
